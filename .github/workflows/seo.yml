name: SEO - sitemap & IndexNow

# Runs on every human push to main: regenerates sitemap.xml from the tracked
# pages and pings IndexNow with whatever changed. Pushes made by the cron bots
# (default GITHUB_TOKEN) do NOT trigger this workflow — those workflows run
# the same steps themselves.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap lastmod + diff range need it

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild topic and category pages
        # Stage the output before the sitemap step: generate-sitemap.js reads
        # git ls-files, so a brand-new topic page must be in the index first.
        run: |
          node scripts/build-topics.js
          git add topics articles articles.html llms.txt

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap and topics if changed
        run: |
          git config user.name "zhg-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && echo "sitemap/topics unchanged" || (git commit -m "Auto-update sitemap and topics" && git push)

      - name: Ping IndexNow with changed pages
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/indexnow-ping.js
