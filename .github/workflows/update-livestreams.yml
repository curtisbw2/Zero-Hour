name: Update Livestreams

on:
  schedule:
    # Daily 13:00 UTC (~8-9am ET), catches the previous day's streams
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull new livestreams from YouTube RSS
        run: node scripts/update-livestreams.js

      - name: Commit and push if changed
        run: |
          git config user.name "zhg-streams-bot"
          git config user.email "actions@users.noreply.github.com"
          git add livestreams.html earnings.html scripts/livestreams.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto-update livestreams" && git push)
