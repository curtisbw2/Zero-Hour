name: Update Sunday Night Live

on:
  schedule:
    # Monday 14:00 UTC (~9-10am ET), after the Sunday night show is uploaded
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod needs git history

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull new episodes from YouTube RSS
        run: node scripts/update-snl.js

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "zhg-snl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sunday-night-live.html scripts/snl-episodes.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update Sunday Night Live episodes" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping IndexNow with changed pages
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow-ping.js
